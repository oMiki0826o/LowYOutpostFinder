name: Native estimated-height smoke

on:
  push:
    branches: [feat/simple-low-y-home-20261103]
    paths:
      - 'lowy_outpost_finder/native_bootstrap.py'
      - 'lowy_outpost_finder/simple_workflow.py'
      - 'native/**'
      - 'scripts/build_native.py'
      - '.github/workflows/native-estimate-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-search:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check build prerequisites
        run: |
          git --version
          cmake --version
          cc --version
      - name: Automatic first-run native build
        run: |
          python - <<'PY'
          from lowy_outpost_finder.native_bootstrap import ensure_native_estimator
          result = ensure_native_estimator(status=print)
          print('Native binary:', result)
          PY
      - name: Seed-only estimated-height smoke test
        run: |
          python - <<'PY'
          import csv
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from lowy_outpost_finder.simple_workflow import SimpleRequest, build_search_arguments, export_results
          with tempfile.TemporaryDirectory() as temp:
              folder = Path(temp)
              raw = folder / 'engine.csv'
              public = folder / 'public.csv'
              req = SimpleRequest(seed='123', radius='4096', max_y='320', top='1')
              args = build_search_arguments(req, raw)
              result = subprocess.run([sys.executable, '-m', 'lowy_outpost_finder', *args],
                  check=True, capture_output=True, text=True, timeout=240)
              print(result.stderr[-1200:])
              rows = export_results(raw, public, req)
              assert rows, 'Scanner produced no test candidate'
              assert public.is_file()
              with public.open(encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  assert reader.fieldnames[4] == 'estimated_y'
              print(rows[0])
          PY
